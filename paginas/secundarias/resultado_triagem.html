<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/estilos/global.css">
  <title>Resultado da triagem</title>
</head>
<body class="layout_painel">
  <div id="menu_lateral"></div>
  <main class="area_principal">
    <div class="cabecalho_pagina">
      <h1>Resultado da triagem</h1>
    </div>

    <p id="erro_resultado" class="mensagem_erro" hidden></p>

    <section class="cartao resultado_triagem">
      <div class="painel_paciente">
        <h2>Paciente</h2>
        <p>Nome: <span id="paciente_nome"></span></p>
        <p>Idade: <span id="paciente_idade"></span></p>
        <p>Sexo: <span id="paciente_sexo"></span></p>
        <p>Observações: <span id="paciente_observacoes"></span></p>
      </div>

      <div>
        <h2>Análise</h2>
        <p>Score: <span id="pontuacao"></span></p>
        <p>Limiar: <span id="limiar"></span></p>
        <p class="resultado_destaque">Resultado: <span id="resultado"></span></p>
      </div>

      <div>
        <h2>Sintomas presentes</h2>
        <ul id="lista_sintomas_marcados"></ul>
      </div>

      <div>
        <h2>Data da avaliação</h2>
        <p id="data_avaliacao"></p>
      </div>

      <div class="linha_botoes">
        <button type="button" class="botao_primario" id="botao_nova_avaliacao">Nova avaliação</button>
        <button type="button" class="botao_secundario" id="botao_imprimir">Imprimir</button>
        <button type="button" class="botao_secundario" id="botao_voltar">Voltar ao painel</button>
      </div>
    </section>
  </main>

  <script src="/js/configuracao.js"></script>
  <script src="/js/armazenamento.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/autenticacao.js"></script>
  <script src="/js/utilidades.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/paginas/resultado_triagem.js"></script>
</body>
</html>
