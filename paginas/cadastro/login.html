<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/estilos/global.css">
  <title>Login - Sistema de Triagem Clínica</title>
</head>
<body class="layout_autenticacao">
  <div class="container_login">
    <h1>Sistema de Triagem Clínica</h1>
    <p class="subtitulo_login">Sistema de apoio à triagem clínica</p>

    <p id="erro_login" class="mensagem_erro" hidden></p>

    <form id="formulario_login" class="formulario">
      <div class="grupo_campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="grupo_campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
      </div>
      <button type="submit" class="botao_primario">Entrar</button>
      <p><a href="recuperar_senha.html">Recuperar senha</a></p>
    </form>
  </div>

  <script src="/js/configuracao.js"></script>
  <script src="/js/armazenamento.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/autenticacao.js"></script>
  <script src="/js/utilidades.js"></script>
  <script src="/js/paginas/login.js"></script>
</body>
</html>
