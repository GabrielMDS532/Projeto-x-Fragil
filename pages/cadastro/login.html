<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/global.css">
    <title>Login - Sistema de Triagem Clínica</title>
</head>
<body>
    <div class="principal">
        <div class="container_login">
            <svg class="borboleta-ui" width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto 20px; display: block; filter: drop-shadow(0px 4px 10px rgba(59, 130, 246, 0.35)); pointer-events: none;">
                <path d="M50 50 C30 20, 10 30, 15 55 C18 70, 35 75, 50 60" fill="#3b82f6" opacity="0.85"/>
                <path d="M50 50 C25 10, 5 15, 10 45 C13 60, 30 65, 50 55" fill="#60a5fa" opacity="0.9"/>
                <path d="M50 50 C35 35, 20 40, 22 52 C23 60, 35 62, 50 55" fill="#93c5fd" opacity="0.95"/>
                <path d="M50 50 C70 20, 90 30, 85 55 C82 70, 65 75, 50 60" fill="#3b82f6" opacity="0.85"/>
                <path d="M50 50 C75 10, 95 15, 90 45 C87 60, 70 65, 50 55" fill="#60a5fa" opacity="0.9"/>
                <path d="M50 50 C65 35, 80 40, 78 52 C77 60, 65 62, 50 55" fill="#93c5fd" opacity="0.95"/>
                <path d="M48 25 C48 22, 52 22, 52 25 L51 75 C51 77, 49 77, 49 75 Z" fill="#1e293b"/>
                <circle cx="50" cy="23" r="3" fill="#1e293b"/>
                <path d="M49 22 Q43 14 38 16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M51 22 Q57 14 62 16" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <h2>Sistema de Triagem Clínica</h2>
            <p style="text-align: center; color: #666; margin-bottom: 30px;">Sistema de apoio à triagem clínica</p>

            <form id="loginForm">
                <label for="Email">Email / Usuário:</label>
                <input type="email" id="Email" name="email" placeholder="seu@email.com" required>
                <span id="emailError">Por favor, insira um email válido.</span>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                <span id="senhaError">A senha deve conter pelo menos 6 caracteres.</span>

                <button type="submit">Entrar</button>

                    
                <p>Esqueci minha senha. <a href="recuperar_senha.html">Recuperar Senha</a></p>
                <p style="margin-top: 10px; font-size: 12px;">
                    <!--Demo: admin@clinica.com ou user@clinica.com-->
                </p>
            </form>
        </div>
    </div>

<script src="../../js/login.js"></script>

</body>
</html>
