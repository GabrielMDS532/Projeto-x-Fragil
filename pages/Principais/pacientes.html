<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/global.css">
    <title>Pacientes - Sistema de Triagem Clínica</title>
</head>
<body class="dashboard-layout">

    <!-- Menu Lateral -->
    <div class="menu">
        <div class="titulo">
            <h3>Sistema de Triagem Clínica</h3>
            <p>MVP</p>
        </div>
        <div class="Paginas">
            <button onclick="navigate('dashboard.html')">📊 Dashboard</button>
            <button class="active" onclick="navigate('pacientes.html')">👥 Pacientes</button>
            <button onclick="navigate('../Secundarias/nova_avaliacao.html')">📋 Nova Avaliação</button>
            <button onclick="navigate('relatorios.html')">📄 Relatórios</button>
            <button onclick="navigate('usuarios.html')" id="btnUsuarios">⚙️ Usuários</button>
        </div>
        <div class="Acesso_usuario">
            <button class="btn-acesso_usuario" id="userInfo">👤 Usuário</button>
        </div>
        <div class="logout">
            <button class="btn-logout" onclick="logout()">🚪 Sair</button>
        </div>
    </div>

    <!-- Principal -->
    <div class="Principal">
        <div class="container_area">

            <div class="Mensagem_entrada">
                <h4>Lista de Pacientes</h4>
                <button class="btn-primary" onclick="navigate('../Secundarias/novo_paciente.html')">➕ Novo Paciente</button>
            </div>

            <!-- Filtros -->
            <div class="filtros-container">
                <div class="filtros-grid">
                    <div class="form-group">
                        <label for="searchName">Buscar por nome</label>
                        <input type="text" id="searchName" placeholder="Digite o nome...">
                    </div>
                    <div class="form-group">
                        <label for="filterSex">Sexo</label>
                        <select id="filterSex">
                            <option value="todos">Todos</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tabela de Pacientes -->
            <div class="tabela-pacientes">
                <table>
                    <thead>
                        <tr>
                            <th>Nome Completo</th>
                            <th>Sexo</th>
                            <th>Idade (Nascimento)</th>
                            <th>Responsável</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTable">
                        <!-- Renderizado dinamicamente pelo JavaScript (Sem dados mockados permanentes) -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="../../js/pacientes.js"></script>
</body>
</html>
