<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/global.css">
    <title>Novo Paciente - Sistema de Triagem Clínica</title>
</head>
<body class="dashboard-layout">

    <!-- Menu Lateral -->
    <div class="menu">
        <div class="titulo">
            <h3>Sistema de Triagem Clínica</h3>
            <p>MVP</p>
        </div>
        <div class="Paginas">
            <button onclick="navigate('../Principais/dashboard.html')">📊 Dashboard</button>
            <button class="active" onclick="navigate('../Principais/pacientes.html')">👥 Pacientes</button>
            <button onclick="navigate('nova_avaliacao.html')">📋 Nova Avaliação</button>
            <button onclick="navigate('../Principais/relatorios.html')">📄 Relatórios</button>
            <button onclick="navigate('../Principais/usuarios.html')" id="btnUsuarios">⚙️ Usuários</button>
        </div>
        <div class="Acesso_usuario">
            <button class="btn-acesso_usuario" id="userInfo">👤 Usuário</button>
        </div>
        <div class="logout">
            <button class="btn-logout" onclick="logout()">🚪 Sair</button>
        </div>
    </div>

    <!-- Principal -->
    <div class="Principal">
        <div class="container_area">
            
            <div class="Mensagem_entrada">
                <div>
                    <button class="btn-secondary" onclick="navigate('../Principais/pacientes.html')" style="margin-right: 15px;">← Voltar</button>
                    <h4 style="display: inline;">Cadastrar Novo Paciente</h4>
                </div>
            </div>

            <div class="form-container">
                <form id="patientForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome_paciente">Nome Completo *</label>
                            <input type="text" id="nome_paciente" required placeholder="Digite o nome do paciente">
                        </div>
                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="sexo_paciente">Sexo *</label>
                            <select id="sexo_paciente" required>
                                <option value="">Selecione</option>
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="data_nascimento_paciente">Data de Nascimento *</label>
                            <input type="date" id="data_nascimento_paciente" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome_responsavel">Responsável *</label>
                            <input type="text" id="nome_responsavel" required placeholder="Nome do responsável">
                        </div>

                        <div class="form-group">
                            <label for="parentesco_responsavel">Parentesco do Responsável</label>
                            <input type="text" id="parentesco_responsavel" placeholder="Ex: Pai, Mãe, Tutor">
                        </div>

                        <div class="form-group">
                            <label for="telefone_paciente">Telefone/Contato *</label>
                            <input type="tel" id="telefone_paciente" required placeholder="(00) 00000-0000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="foto_paciente">Foto do Paciente</label>
                            <input type="file" id="foto_paciente" accept="image/*">
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 15px; margin-top: auto; margin-bottom: 5px;">
                            <div id="preview-container" style="position: relative; width: 80px; height: 80px; border-radius: 8px; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f8fafc;">
                                <img id="foto_preview" src="" alt="Pré-visualização" style="display: none; width: 100%; height: 100%; object-fit: cover;">
                                <span id="preview-placeholder" style="font-size: 24px; color: #94a3b8;">📷</span>
                                <button type="button" id="btn-remover-foto" style="display: none; position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9); border: none; border-radius: 50%; color: white; cursor: pointer; width: 22px; height: 22px; align-items: center; justify-content: center; font-size: 11px; z-index: 10; padding: 0; line-height: 1;" title="Remover Foto">🗑️</button>
                            </div>
                            <div style="font-size: 12px; color: #64748b;">
                                <p style="margin: 0; font-weight: 500;">Pré-visualização da Foto</p>
                                <p style="margin: 3px 0 0 0;">Formatos: PNG, JPG, WEBP (Máx. 2MB)</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="observacoes_paciente">Observações</label>
                        <textarea id="observacoes_paciente" rows="4" placeholder="Informações adicionais (opcional)"></textarea>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" class="btn-primary">Salvar Paciente</button>
                        <button type="button" class="btn-secondary" onclick="navigate('../Principais/pacientes.html')">Cancelar</button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="../../js/storage.js"></script>
    <script src="../../js/novo_paciente.js"></script>
</body>
</html>
